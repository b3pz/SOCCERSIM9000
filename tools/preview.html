<!doctype html><html lang="it"><meta charset="utf-8"><title>Verifica interfaccia SerieA 9000</title>
<style>body{margin:0;background:#192330;color:#fff;font:13px system-ui}nav{display:flex;flex-wrap:wrap;gap:5px;padding:8px}button,select{min-height:34px}iframe{display:block;border:0;margin:0 auto;background:#020817}#status{padding:4px 10px;min-height:20px}</style>
<nav><select id="size"><option value="1180,700">Desktop 1180 × 700</option><option value="390,844">Telefono 390 × 844</option><option value="844,390">Telefono 844 × 390</option><option value="360,740">Telefono 360 × 740</option></select><button id="prepare">Carriera di prova</button><button data-view="calendar">Calendario</button><button data-view="table">Gironi</button><button data-view="europe">Coppe</button><button id="home">Stagione</button><button id="prematch">Pre-partita</button><button id="trophy">Cinematica</button><select id="venue"><option>San Siro</option><option>Stadio Olimpico</option><option>Artemio Franchi</option><option>Luigi Ferraris</option><option>Ennio Tardini</option></select><button id="stadium">Stadio 3D</button><button id="check">Controlla layout</button></nav><div id="status">Anteprima di sviluppo; nessun salvataggio della carriera.</div><iframe id="game" src="../index.html" width="1180" height="700" title="Gioco in verifica" allowfullscreen></iframe>
<script>
const frame=document.querySelector('iframe'),status=document.querySelector('#status');const win=()=>frame.contentWindow;
function report(){const w=win(),d=w.document,active=d.querySelector('.screen.active');const over=active?[...active.querySelectorAll('*')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.left< w.innerWidth&&r.right>w.innerWidth+2&&w.getComputedStyle(e).position!=='absolute'&&!e.closest('.v10-bracket,.table-wrap')}):[];status.textContent=`Viewport ${w.innerWidth} × ${w.innerHeight} · ${active?.id} · Elementi oltre il bordo: ${over.length}`}
document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h;setTimeout(report,200)};
document.querySelector('#prepare').onclick=()=>{const w=win(),d=w.document;w.S9Save.putCareer=async()=>{};const intro=d.querySelector('#titleScreen');if(intro){intro.hidden=true;intro.style.display='none'}d.querySelector('#managerName').value='Verifica';d.querySelector('#managerTeam').value='inter_9798';d.querySelector('#createCareer').onclick();report()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{win().renderSeasonView(b.dataset.view);report()});
document.querySelector('#home').onclick=()=>{win().renderSeason();win().show('season');report()};
document.querySelector('#prematch').onclick=()=>{win().openPrematch(win().nextUserGame());setTimeout(report,100)};
document.querySelector('#trophy').onclick=()=>{const w=win();w.S9Celebration.record({id:'preview_'+Date.now(),key:'cdc',user:'inter_9798',champion:'inter_9798',completed:true,phase:'DONE',roundHistory:{FINAL:[{winner:'inter_9798',twoLeg:false,legs:[{h:'inter_9798',a:'milan_9394',hg:2,ag:0}]}]}})};
document.querySelector('#stadium').onclick=()=>{const w=win(),venue=document.querySelector('#venue').value;if(w.S9V10.matchContext?.mode==='friendly'){w.S9V10.matchContext.stadium=venue;w.show('match');return}w.S9Exhibition.start({home:'inter_9798',away:w.S9V10.italianIds.find(id=>id!=='inter_9798'),competition:'friendly',stadium:venue,final:false});w.S9Match3D.setMode('3d');w.launchMatch();setTimeout(()=>{w.document.querySelector('#pauseBtn').click();report()},250)};
document.querySelector('#check').onclick=report;
frame.onload=()=>{win().addEventListener('error',e=>status.textContent='ERRORE: '+e.message);win().addEventListener('unhandledrejection',e=>status.textContent='PROMISE: '+e.reason)};
</script></html>
